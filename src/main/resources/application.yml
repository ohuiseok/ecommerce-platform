server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ecommerce-monolith
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
    baseline-description: ${SPRING_FLYWAY_BASELINE_DESCRIPTION:baseline existing schema}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:ecommerce-monolith-secret-key-for-jwt-token-generation}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrator}
  order:
    pending-expiration:
      expiration-minutes: ${ORDER_PENDING_EXPIRATION_MINUTES:30}
      fixed-delay-ms: ${ORDER_PENDING_EXPIRATION_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${ORDER_PENDING_EXPIRATION_INITIAL_DELAY_MS:60000}
      batch-size: ${ORDER_PENDING_EXPIRATION_BATCH_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p traceId=[%X{traceId}]"
  level:
    root: INFO
    com.ecommerce.monolith: DEBUG
    org.hibernate.SQL: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
